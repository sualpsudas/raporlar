    +kol.map(i=>{const c=o.h[i];if(!c)return `<td class="bos">—</td>`;
      let d="";if(c.o&&c.o!==c.f){const r=Math.round((c.f-c.o)/c.o*100);
        d=r?`<span class="d ${r<0?"a":"u"}" title="önceki ${tl(c.o)} ₺">${r<0?"▼":"▲"}${Math.abs(r)}%</span>`:"";}
      return `<td class="f${i===o.mi?" min":""}${hf!==""?" sec":""}" title="toplam ${tl(c.t)} ₺ (${V.kriter.gece} gece)"><a href="${c.u}" target="_blank" rel="noopener">${tl(c.f)}</a>${d}</td>`;}).join("")+"</tr>";}).join("");
  $("#say").textContent=`${L.length} / ${V.oteller.length} otel`;
  document.querySelectorAll("#t th").forEach(th=>th.onclick=()=>{const kk=th.dataset.k;
    sira={k:isNaN(kk)?kk:+kk,y:sira.k==(isNaN(kk)?kk:+kk)?-sira.y:(kk==="puan"||kk==="yorum"?-1:1)};ciz();});
  ozet(L);}
function ozet(L){const g={};L.forEach(o=>{(g[o.bolge]=g[o.bolge]||{il:o.il,ilce:o.ilce,o:[]}).o.push(o)});
  const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
  const r=Object.entries(g).map(([b,v])=>({b,...v,n:v.o.length,p:v.o.reduce((s,o)=>s+o.puan,0)/v.o.length,
    m:med(v.o.map(o=>o.min)),u:Math.min(...v.o.map(o=>o.min??Infinity))})).sort((a,b)=>a.m-b.m);
  $("#ozet").innerHTML=`<table class="oz"><tr><th>Bölge</th><th>Otel</th><th>Ort. puan</th><th>Ortanca en ucuz</th><th>En ucuz</th></tr>`
   +r.map(x=>`<tr><td>${x.b} <small style="color:#888">${x.ilce}, ${x.il}</small></td><td>${x.n}</td><td>${tl(Math.round(x.p*100)/100)}</td><td>${tl(x.m)}</td><td>${tl(x.u)}</td></tr>`).join("")+"</table>";}
["#il","#bolge","#puan","#hafta"].forEach(s=>$(s).onchange=()=>{if(s==="#il")bolgeDoldur();
  if(s==="#hafta"&&$("#hafta").value!=="")sira={k:+$("#hafta").value,y:1};ciz();});
["#ara","#maks"].forEach(s=>$(s).oninput=ciz);
$("#sifirla").onclick=()=>{["#il","#bolge","#ara","#maks","#hafta"].forEach(s=>$(s).value="");$("#puan").selectedIndex=0;sira={k:"min",y:1};bolgeDoldur();ciz();};
bolgeDoldur();ciz();
</script>
</html>
