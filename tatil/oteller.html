  if(s==="#hafta"&&$("#hafta").value!=="")sira={k:+$("#hafta").value,y:1};ciz();});
["#ara","#maks"].forEach(s=>$(s).oninput=ciz);
$("#tarih").onclick=()=>{tarihAcik=!tarihAcik;ciz();};
$("#sifirla").onclick=()=>{["#il","#bolge","#ara","#maks","#hafta","#yy"].forEach(s=>$(s).value="");$("#puan").selectedIndex=0;$("#yorum").selectedIndex=0;sira={k:"min",y:1};bolgeDoldur();ciz();};
bolgeDoldur();ciz();
</script>
