$("#alt").innerHTML=`${V.kriter.yetiskin} yetişkin · ${V.kriter.gece} gece · cumartesi giriş · 5 yıldız · her şey dahil · Google puanı ≥ ${tl(V.kriter.puan)} · fiyat = gecelik en uygun teklif (vergiler dahil, Google iş ortakları) · güncelleme ${V.uretim}`;
[...new Set(V.oteller.map(o=>o.il))].sort().forEach(i=>$("#il").add(new Option(i,i)));
const puanlar=[V.kriter.puan,4.5,4.6,4.7,4.8].filter((x,i,a)=>a.indexOf(x)===i&&x>=V.kriter.puan);
puanlar.forEach(p=>$("#puan").add(new Option(tl(p),p)));
H.forEach((h,i)=>$("#hafta").add(new Option(`${h.e} – ${h.c}${P.has(h.g)?"":" (henüz yok)"}`,i)));
function bolgeDoldur(){const il=$("#il").value,s=$("#bolge"),v=s.value;s.length=1;
  [...new Set(V.oteller.filter(o=>!il||o.il===il).map(o=>o.bolge))].sort((a,b)=>a.localeCompare(b,"tr"))
   .forEach(b=>s.add(new Option(b,b)));s.value=[...s.options].some(o=>o.value===v)?v:"";}
function suz(){const il=$("#il").value,b=$("#bolge").value,a=$("#ara").value.toLocaleLowerCase("tr"),
  p=+$("#puan").value,m=+$("#maks").value||Infinity,hf=$("#hafta").value;
  return V.oteller.filter(o=>(!il||o.il===il)&&(!b||o.bolge===b)&&(!a||o.ad.toLocaleLowerCase("tr").includes(a))
    &&o.puan>=p&&(hf===""?(o.min!=null&&o.min<=m):(o.h[hf]&&o.h[hf].f<=m)));}
function deger(o,k){if(k==="ad")return o.ad;if(k==="bolge")return o.bolge;if(k==="puan")return o.puan;
  if(k==="yorum")return o.yorum;if(k==="min")return o.min;const c=o.h[k];return c?c.f:null;}
function ciz(){const hf=$("#hafta").value;const L=suz();
  const k=sira.k,y=sira.y;L.sort((a,b)=>{const x=deger(a,k),z=deger(b,k);if(x==null)return 1;if(z==null)return -1;
    return (typeof x==="string"?x.localeCompare(z,"tr"):x-z)*y;});
  const kol=hf===""?H.map((h,i)=>i):[+hf];
  $("#t thead").innerHTML="<tr>"+`<th class="ad" data-k="ad">Otel<small>bölge · ilçe</small></th>`
    +`<th data-k="puan">Puan<small>yorum</small></th><th data-k="min">En ucuz<small>gecelik ₺</small></th>`
    +kol.map(i=>`<th data-k="${i}" class="${P.has(H[i].g)?"":"yok"}${hf!==""?" sec":""}">${H[i].e}<small>${P.has(H[i].g)?"– "+H[i].c:"henüz yok"}</small></th>`).join("")+"</tr>";
  $("#t tbody").innerHTML=L.map(o=>{
    const ilk=o.h.find(c=>c);
    return `<tr><td class="ad"><a href="${ilk?ilk.u:"#"}" target="_blank" rel="noopener">${o.ad}</a><small>${o.bolge} · ${o.ilce}, ${o.il}</small></td>`
    +`<td class="p">${tl(o.puan)}<small>${tl(o.yorum)}</small></td>`
    +`<td class="eu">${tl(o.min)}<small>${o.mi>=0?H[o.mi].e:""}</small></td>`
    +kol.map(i=>{const c=o.h[i];if(!c)return `<td class="bos">—</td>`;
      let d="";if(c.o&&c.o!==c.f){const r=Math.round((c.f-c.o)/c.o*100);
        d=r?`<span class="d ${r<0?"a":"u"}" title="önceki ${tl(c.o)} ₺">${r<0?"▼":"▲"}${Math.abs(r)}%</span>`:"";}
      return `<td class="f${i===o.mi?" min":""}${hf!==""?" sec":""}" title="toplam ${tl(c.t)} ₺ (${V.kriter.gece} gece)"><a href="${c.u}" target="_blank" rel="noopener">${tl(c.f)}</a>${d}</td>`;}).join("")+"</tr>";}).join("");
  $("#say").textContent=`${L.length} / ${V.oteller.length} otel`;
  document.querySelectorAll("#t th").forEach(th=>th.onclick=()=>{const kk=th.dataset.k;
    sira={k:isNaN(kk)?kk:+kk,y:sira.k==(isNaN(kk)?kk:+kk)?-sira.y:(kk==="puan"||kk==="yorum"?-1:1)};ciz();});
  ozet(L);}
function ozet(L){const g={};L.forEach(o=>{(g[o.bolge]=g[o.bolge]||{il:o.il,ilce:o.ilce,o:[]}).o.push(o)});
  const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
  const r=Object.entries(g).map(([b,v])=>({b,...v,n:v.o.length,p:v.o.reduce((s,o)=>s+o.puan,0)/v.o.length,
    m:med(v.o.map(o=>o.min)),u:Math.min(...v.o.map(o=>o.min??Infinity))})).sort((a,b)=>a.m-b.m);
  $("#ozet").innerHTML=`<table class="oz"><tr><th>Bölge</th><th>Otel</th><th>Ort. puan</th><th>Ortanca en ucuz</th><th>En ucuz</th></tr>`
   +r.map(x=>`<tr><td>${x.b} <small style="color:#888">${x.ilce}, ${x.il}</small></td><td>${x.n}</td><td>${tl(Math.round(x.p*100)/100)}</td><td>${tl(x.m)}</td><td>${tl(x.u)}</td></tr>`).join("")+"</table>";}
["#il","#bolge","#puan","#hafta"].forEach(s=>$(s).onchange=()=>{if(s==="#il")bolgeDoldur();
  if(s==="#hafta"&&$("#hafta").value!=="")sira={k:+$("#hafta").value,y:1};ciz();});
["#ara","#maks"].forEach(s=>$(s).oninput=ciz);
$("#sifirla").onclick=()=>{["#il","#bolge","#ara","#maks","#hafta"].forEach(s=>$(s).value="");$("#puan").selectedIndex=0;sira={k:"min",y:1};bolgeDoldur();ciz();};
bolgeDoldur();ciz();
</script>
</html>
