const $=s=>document.querySelector(s);
const tl=n=>n==null?"":n.toLocaleString("tr-TR");
const H=V.haftalar, P=new Set(V.pencere);
V.oteller.forEach(o=>{const f=o.h.map((c,i)=>c?[c.f,i]:null).filter(Boolean);

let sira={k:"min",y:1};
const SEC=new Set();

$("#alt").innerHTML=`${V.kriter.yetiskin} yetişkin · ${V.kriter.gece} gece · cumartesi giriş · 5 yıldız · her şey dahil · Google puanı ≥ ${tl(V.kriter.puan)} · "yalnız yetişkin" işareti bilinen otellerle sınırlı, işaretsiz = bilinmiyor · fiyat = gecelik en uygun teklif (vergiler dahil, Google iş ortakları) · güncelleme ${V.uretim}${V.elenen&&V.elenen.length?` · olağandışı fiyat nedeniyle gösterilmeyen: ${V.elenen.join(", ")}`:""}`;

function bolgeDoldur(){const il=$("#il").value,s=$("#bolge"),v=s.value;s.length=1;

function suz(){const il=$("#il").value,b=$("#bolge").value,a=$("#ara").value.toLocaleLowerCase("tr"),

function ciz(){const hf=$("#hafta").value;const L=suz();

  $("#t tbody").innerHTML=L.map(o=>{

    return `<tr data-ad="${o.ad.replace(/"/g,"&quot;")}"${SEC.has(o.ad)?' class="sel"':""}><td class="ad"><a href="${ilk?ilk.u:"#"}" target="_blank" rel="noopener">${o.ad}</a><small>${o.bolge} · ${o.ilce}, ${o.il}${o.yy?" · <b>yalnız yetişkin</b>":""}</small></td>`

      return `<td class="f${i===o.mi?" min":""}${hf!==""?" sec":""}" title="toplam ${tl(c.t)} ₺ (${V.kriter.gece} gece)"><a href="${c.u}" target="_blank" rel="noopener">${tl(c.f)}</a>${d}</td>`;}).join("")+"</tr>";}).join("");

  ozet(L);}
function ozet(L){const g={};L.forEach(o=>{(g[o.bolge]=g[o.bolge]||{il:o.il,ilce:o.ilce,o:[]}).o.push(o)});
  const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
  const r=Object.entries(g).map(([b,v])=>({b,...v,n:v.o.length,p:v.o.reduce((s,o)=>s+o.puan,0)/v.o.length,
    m:med(v.o.map(o=>o.min)),u:Math.min(...v.o.map(o=>o.min??Infinity))})).sort((a,b)=>a.m-b.m);
  $("#ozet").innerHTML=`<table class="oz"><tr><th>Bölge</th><th>Otel</th><th>Ort. puan</th><th>Ortanca en ucuz</th><th>En ucuz</th></tr>`

["#il","#bolge","#puan","#yorum","#hafta","#yy"].forEach(s=>$(s).onchange=()=>{if(s==="#il")bolgeDoldur();

["#ara","#maks"].forEach(s=>$(s).oninput=ciz);
$("#tarih").onclick=()=>{tarihAcik=!tarihAcik;ciz();};

bolgeDoldur();ciz();
</script>
