<!doctype html><html lang="tr"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Ev raporu · Hepsi</title>
<style>:root{color-scheme:light;--acc:#2f6f4f;--s1:#2a78d6;--s1a:#9cc0ec;--art:#2f6f4f;--eks:#c4532a;
--ink:#222;--ink2:#555;--ink3:#888;--yuzey:#fff;--zemin:#f4f4f2;--cizgi:#eee}
body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--zemin);color:var(--ink);margin:0 auto;
padding:20px 16px 40px;max-width:900px}
h1{font-weight:600;font-size:22px;margin:6px 0}h2{font-size:18px;margin:32px 0 6px}
.nav{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.nav a{padding:5px 12px;border-radius:14px;background:#fff;border:1px solid #ddd;text-decoration:none;color:#333;font-size:13px}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.n{color:#666;font-size:13px;line-height:1.5}
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.kart{background:var(--yuzey);border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kart b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kart span{color:#666;font-size:13px}
.kutu{background:var(--yuzey);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
.pad{padding:14px}
ul.oc{background:var(--yuzey);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:12px 0 0;
padding:12px 14px 12px 32px;line-height:1.6;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--cizgi);text-align:left;white-space:nowrap}
th{font-size:12px;color:#666;font-weight:600;background:#fafaf8}
.s{text-align:right;font-variant-numeric:tabular-nums}.b{font-weight:600}
tr.ilce{cursor:pointer}tr.ilce:hover{background:#f6f8f6}tr.ilce td:first-child::before{content:"▸ ";color:#999}
tr.ilce.acik td:first-child::before{content:"▾ "}
tr.mah{display:none;background:#fafaf8;font-size:13px}tr.mah td:first-child{padding-left:28px}
tr.mah.goster{display:table-row}tr.gizli{display:none!important}
.d{color:var(--art);font-weight:600}.e{color:var(--eks);font-weight:600}a{color:#1f5a8a}
td.baslik{white-space:normal;min-width:200px}td.baslik small{display:block;color:#777;font-size:12px;margin-top:3px}
s{color:#999}.il{display:flex;gap:10px;align-items:center}
.ft{flex:none;width:64px;height:48px;object-fit:cover;border-radius:6px;background:#eee;display:inline-block}
input.ara{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin:0 0 8px}
/* secim dugmeleri */
.secim{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.secim button{font:inherit;font-size:13px;padding:5px 12px;border-radius:14px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer}
.secim button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.secim .ayr{width:100%;height:0}
/* yatay cubuk grafikler (HTML: telefonda yazilar kuculmez) */
.cg{display:grid;gap:4px}
.cs{display:grid;grid-template-columns:minmax(80px,130px) 1fr minmax(70px,auto);align-items:center;gap:10px;
font-size:14px;padding:3px 0;border-radius:4px}
.cs:hover{background:#f3f6fa}
.ce{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cy{position:relative;height:20px}
.cy i{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--s1)}
.cy b{position:absolute;top:9px;height:2px;background:#1b3f6b;opacity:.55}
.cy u{position:absolute;top:5px;width:2px;height:10px;background:#1b3f6b;opacity:.55}
.cd{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cd small{font-weight:400;color:var(--ink3)}
.az{color:var(--ink3);font-size:12px}
.lej{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.lej i{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--s1);margin-right:5px;vertical-align:middle}
.lej b{display:inline-block;width:18px;height:2px;background:#1b3f6b;opacity:.55;margin-right:5px;vertical-align:middle}
/* ozellik etkisi: ortadan saga (+) / sola (-) */
.oz{display:grid;gap:6px}
.ozs{display:grid;grid-template-columns:minmax(100px,140px) 1fr 64px;gap:10px;align-items:center;font-size:14px}
.ozc{position:relative;height:22px;background:linear-gradient(#ccc,#ccc) center/1px 100% no-repeat}
.ozc i{position:absolute;top:3px;bottom:3px}
.ozs small{display:block;color:var(--ink3);font-size:12px}
@media(max-width:600px){.cs{grid-template-columns:86px 1fr auto;gap:6px;font-size:13px}
.ozs{grid-template-columns:96px 1fr 52px;gap:6px}th,td{padding:7px 6px}.ft{width:48px;height:38px}
td.baslik{min-width:130px;font-size:13px}.il{gap:6px}}
:root{--ink3:#6b6b6b}s{color:#777}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hsec{position:sticky;top:0;z-index:5;background:var(--zemin);margin:0 -16px;padding:6px 16px 8px;border-bottom:1px solid #ddd}
.hsec .g{display:flex;gap:6px;margin:4px 0}
.hsec button{flex:1;font:inherit;font-size:15px;min-height:44px;border-radius:10px;border:1px solid #aaa;background:#fff;color:#222;cursor:pointer}
.hsec button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
#sonuc .secim button{min-height:40px;padding:6px 14px;font-size:14px}
#sonuc .secim button.on{background:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,.kutu:focus-visible,tr:focus-visible{outline:3px solid #2a78d6;outline-offset:2px}
#baslik{margin:18px 0 2px;font-size:20px}#baslik:focus{outline:none}
</style>
<div class="nav"><a href="../">🏠 Genel raporlar</a><a href="index.html">↑ Ev Raporları</a><a class="on" aria-current="page" href="hepsi.html">📊 Hepsi</a></div>
<h1>Ev raporu · İstanbul</h1>
<div class="hsec">
<div class="g" role="group" aria-label="İlan türü" id="turs"><button data-tur="kiralik">Kiralık</button><button data-tur="satilik">Satılık</button></div>
<div class="g" role="group" aria-label="Yaka" id="yakas"><button data-yaka="anadolu">Anadolu</button><button data-yaka="avrupa">Avrupa</button><button data-yaka="hepsi">Hepsi</button></div>
</div>
<h2 id="baslik" tabindex="-1"></h2>
<p class="n" id="alt" role="status" aria-live="polite"></p>
<main id="sonuc"></main>
<noscript><p class="n">Bu sayfa JavaScript ile çalışır.</p></noscript>
<script>
var SURUM="8d0509d5da",TURAD={kiralik:'Kiralık',satilik:'Satılık'},YAKAAD={anadolu:'Anadolu',avrupa:'Avrupa',hepsi:'Anadolu + Avrupa'};
var tur='kiralik',yaka='hepsi',onbellek={},jeton=0;
function kur(D){
function ilceAc(tr, ac){tr.classList.toggle('acik',ac);tr.setAttribute('aria-expanded',ac);
document.querySelectorAll('tr.mah[data-i="'+tr.dataset.i+'"]').forEach(function(m){m.classList.toggle('goster',ac)})}
document.querySelectorAll('tr.ilce').forEach(function(tr){tr.addEventListener('click',function(){
ilceAc(tr,!tr.classList.contains('acik'))})});
// mahalle arama: eslesen mahalleler ve ilceleri gosterilir
document.getElementById('mara').addEventListener('input',function(e){
var q=e.target.value.trim().toLocaleLowerCase('tr');
document.querySelectorAll('tr.ilce').forEach(function(tr){
 var ms=document.querySelectorAll('tr.mah[data-i="'+tr.dataset.i+'"]'),bir=false,
 ilceUyar=tr.cells[0].textContent.toLocaleLowerCase('tr').indexOf(q)>=0;
 ms.forEach(function(m){var u=!q||ilceUyar||m.cells[0].textContent.toLocaleLowerCase('tr').indexOf(q)>=0;
  m.classList.toggle('gizli',!u);bir=bir||u});
 tr.classList.toggle('gizli',!!q&&!bir&&!ilceUyar);
 ilceAc(tr,!!q&&bir&&!ilceUyar||(!!q&&ilceUyar));
 if(!q)ilceAc(tr,false);
})});
// ilce grafigi
var G=D.g,MN=D.mn,olcu='tlm2',grup='Tümü';
function yaz(v){return olcu==='tlm2'||!MN?Math.round(v).toLocaleString('tr-TR')+' TL':(v/1e6).toFixed(2).replace('.',',')+' mn'}
function ciz(){
 var rs=G.map(function(s){return{ad:s.ad,d:s[grup][olcu]}}),var_=rs.filter(function(r){return r.d});
 var_.sort(function(a,b){return b.d.med-a.d.med});
 var tavan=Math.max.apply(null,var_.map(function(r){return r.d.q3}))||1,yok=rs.filter(function(r){return!r.d});
 var h=var_.map(function(r){var d=r.d,p=function(x){return(x/tavan*100).toFixed(1)+'%'};
  return '<div class="cs" title="'+r.ad+': orta '+yaz(d.med)+' · ilanların yarısı '+yaz(d.q1)+' – '+yaz(d.q3)+' arası · '+d.n+' ilan">'
  +'<span class="ce">'+r.ad+'</span><span class="cy"><i style="width:'+p(d.med)+'"></i>'
  +'<b style="left:'+p(d.q1)+';width:calc('+p(d.q3)+' - '+p(d.q1)+')"></b><u style="left:'+p(d.q1)+'"></u><u style="left:'+p(d.q3)+'"></u></span>'
  +'<span class="cd">'+yaz(d.med)+' <small>· '+d.n+'</small></span></div>'}).join('');
 if(yok.length)h+='<div class="az">Yeterli ilan yok ('+'10'+'\'dan az): '+yok.map(function(r){return r.ad}).join(', ')+'</div>';
 document.getElementById('ig').innerHTML=h;
 document.querySelectorAll('#isec button').forEach(function(b){
  var on=b.dataset.o===olcu||b.dataset.g===grup;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}
document.getElementById('isec').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.o)olcu=b.dataset.o;if(b.dataset.g)grup=b.dataset.g;ciz()});
ciz();
}
function yukle(t){
 if(!onbellek[t])onbellek[t]=fetch('hepsi-'+t+'.json?v='+SURUM).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()});
 return onbellek[t].catch(function(e){delete onbellek[t];throw e});
}
function goster(odak){
 var a=document.getElementById('alt'),s=document.getElementById('sonuc'),j=++jeton;
 document.querySelectorAll('#turs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tur===tur)});
 document.querySelectorAll('#yakas button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.yaka===yaka)});
 var ad=TURAD[tur]+' · '+YAKAAD[yaka];
 document.getElementById('baslik').textContent=ad;document.title=ad+' · Ev raporu';
 if(history.replaceState)history.replaceState(null,'','#'+tur+'-'+yaka);
 a.textContent='Yükleniyor…';
 yukle(tur).then(function(V){
  if(j!==jeton)return;
  var p=V[tur+'-'+yaka];
  if(!p){s.innerHTML='';a.textContent='Bu seçim için henüz tamamlanmış tarama yok.';return}
  a.textContent='Kaynak: sahibinden.com · '+p.t+' tarihli liste turu';
  s.innerHTML=p.h;kur(p);
  s.querySelectorAll('tr.ilce').forEach(function(tr){tr.tabIndex=0;tr.setAttribute('aria-expanded','false');
   tr.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click()}})});
  s.querySelectorAll('.kutu').forEach(function(k){if(k.scrollWidth>k.clientWidth)k.tabIndex=0});
  if(odak)document.getElementById('baslik').focus({preventScroll:true});
 }).catch(function(){if(j===jeton){s.innerHTML='';a.textContent='Rapor yüklenemedi. Sayfayı yenileyin.'}});
}
function hashOku(){var m=/^#(kiralik|satilik)-(anadolu|avrupa|hepsi)$/.exec(location.hash);if(m){tur=m[1];yaka=m[2]}}
document.getElementById('turs').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.tur){tur=b.dataset.tur;goster(true)}});
document.getElementById('yakas').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.yaka){yaka=b.dataset.yaka;goster(true)}});
window.addEventListener('hashchange',function(){hashOku();goster(false)});
hashOku();goster(false);
</script></html>
