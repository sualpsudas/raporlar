<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerçek İndirimler</title>
<style>
:root{--bg:#f4f4f2;--kart:#fff;--bas:#f8f8f6;--yazi:#1d1d1b;--soluk:#5f5f5a;--cizgi:#e2e2dd;--iyi:#1e7a46;--uyari:#a3520f;--vurgu:#1f5fa8;--acik:#eef3fa}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--kart:#1f1f1d;--bas:#262624;--yazi:#ecece8;--soluk:#a5a59e;--cizgi:#34342f;--iyi:#5cc98a;--uyari:#e59a54;--vurgu:#7fb2ee;--acik:#232a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.4 -apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:auto;padding:0 max(12px,env(safe-area-inset-right)) 32px max(12px,env(safe-area-inset-left))}
#ust{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 8px}
nav{display:flex;gap:14px;font-size:14px}
nav a{color:var(--soluk);text-decoration:none;padding:6px 0}
.sira{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sekme{display:flex;gap:6px;grid-column:1/-1}
.sekme button,select,.paylas{min-height:44px;font:inherit;font-size:16px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);border-radius:8px}
.sekme button{flex:1;cursor:pointer}
.sekme button[aria-selected=true]{border-color:var(--vurgu);color:var(--vurgu);font-weight:600}
select{width:100%;padding:0 8px}
.sekme .paylas{padding:0 14px;cursor:pointer;flex:0 0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--kart);border:1px solid var(--cizgi);border-radius:8px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--cizgi);vertical-align:top}
thead th{position:sticky;top:var(--ust,0px);z-index:3;background:var(--bas);font-weight:600;color:var(--soluk);white-space:nowrap}
th button{all:unset;cursor:pointer;min-height:30px;display:inline-flex;align-items:center}
th button:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
th[aria-sort] button{color:var(--yazi)}
th:first-child,td:first-child{padding-left:10px;min-width:120px}
thead th:first-child{z-index:4}
tbody tr.u{cursor:pointer;background:var(--kart)}
tbody tr.u:hover,tbody tr.u[aria-expanded=true]{background:var(--acik)}
.s{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.k{color:var(--soluk)}
td.o{font-weight:700;color:var(--iyi)}
.sis td.o{color:var(--uyari)}
td .ad{font-weight:600;overflow-wrap:anywhere}
td .m{display:block;color:var(--soluk);font-size:13px;margin-top:2px}
tr.g td{background:var(--acik);padding:10px;position:static}
tr.g svg{display:block;width:100%;height:auto;color:var(--vurgu)}
tr.g text{fill:var(--soluk);font-size:12px}
.gec{width:auto;min-width:0;border:0;border-radius:0;background:transparent;margin-top:6px;font-size:13px}
tr.g .gec td{border:0;padding:3px 16px 3px 0;background:transparent}
tr.g .gec td:first-child{padding-left:0;min-width:0}
.git{display:inline-block;margin-top:8px;color:var(--vurgu);min-height:32px}
@media (max-width:420px){table{font-size:13px}th,td{padding:8px 4px}}
</style></head><body><main>
<div id="ust">
<nav><a href="../">🏠 Genel raporlar</a><a href="index.html">↑ Ürün Raporları</a></nav>
<div class="sira">

  <button class="paylas" id="paylas" aria-label="Bağlantıyı paylaş">Paylaş</button>
 </div>
 <select id="kat" aria-label="Tür"></select>
 <select id="mag" aria-label="Mağaza"></select>
</div>
</div>
<table id="tab"><thead><tr id="bas"></tr></thead><tbody id="liste"></tbody></table>
</main>

    return `<tr class="u" tabindex="0" data-i="${i}" aria-expanded="${a}">`+SUT.map(s=>`<td class="${s[4]}">${s[3](x)}</td>`).join("")+"</tr>"+
      (a?`<tr class="g"><td colspan="${SUT.length}">${grafik(x)}</td></tr>`:"");}).join("");
  $("liste").satirlar=r;
  const h=new URLSearchParams();if(sekme=="s")h.set("s","1");if(k)h.set("kat",k);if(m)h.set("mag",m);
  history.replaceState(null,"",h.toString()?"#"+h:location.pathname);
}

  const yeni=$("liste").querySelector(`tr.u[data-i="${tr.dataset.i}"]`);if(yeni)yeni.focus({preventScroll:true});}
