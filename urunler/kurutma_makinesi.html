<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurutma Makinesi fiyat kataloğu</title>
<style>
:root{color-scheme:light;--bg:#f4f4f2;--card:#fff;--fg:#222;--k:#666;--line:#e5e5e2;--acc:#1565c0;--ok:#0a6b3d;--fp:#b5651d;--sel:#fff3cd}
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;font-size:14px}
a{color:var(--acc)}
h1{font-weight:600;margin:0 0 4px;font-size:24px}
.sub{color:var(--k);font-size:13px;margin-bottom:10px;line-height:1.5}
.nav{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.nav a{padding:5px 12px;border-radius:14px;background:#fff;border:1px solid #ddd;text-decoration:none;color:#333;font-size:13px}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ust{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
#ara{flex:1;min-width:180px;padding:9px;font-size:15px;border:1px solid #ccc;border-radius:6px}
button{font:inherit;cursor:pointer}
.btn{padding:8px 12px;font-size:13px;border:1px solid #ccc;background:#fff;border-radius:6px;white-space:nowrap}
.btn:hover{background:#f0f0ee}
#temizle{display:none;border-color:#c62828;color:#c62828}
#sayac{font-size:12px;color:var(--k);margin-top:6px}
/* Tablo kendi kaydirma alaninda (yukseklik JS ile ekranin kalani): baslik satiri bu alana gore
   sabitlenir. Eskiden yalniz yatay kayan kutu baslik satirini sayfa kayarken birakiyordu. */
.tw{overflow:auto;background:#fff;border-radius:8px;box-shadow:0 0 0 1px #e2e2de;max-height:80vh;overscroll-behavior:contain}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{background:#333;color:#fff;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;font-weight:600}.t th.ns{cursor:default}
.t th .y::after{content:" ⇅";opacity:.35;font-size:11px}
.t th.ns .y::after{content:none}.t th.asc .y::after{content:" ▲";opacity:1}.t th.desc .y::after{content:" ▼";opacity:1}
.t th .fb{display:inline-block;margin-left:4px;padding:0 4px;border:1px solid #777;border-radius:3px;font-size:10px;line-height:15px;color:#ccc;background:#444}
.t th .fb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.t tbody tr{cursor:pointer}
.t tbody tr:nth-child(even) td{background:#faf9f7}
.t tbody tr:hover td{background:#d9ecff}
.t tbody tr.sec td{background:var(--sel)}
.t td.c{width:28px;text-align:center}
.t .th{display:inline-block;width:40px;height:40px;object-fit:contain;vertical-align:middle;margin-right:8px;background:#fff;border-radius:4px}
.t td.ad{max-width:300px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.t td.ad{max-width:150px;white-space:normal;line-height:1.25}}
.fiyat{font-weight:700;color:var(--ok)} .okc{color:var(--ok);font-weight:600}
.sekme{display:flex;gap:0;margin-top:8px;border-bottom:2px solid #333}
.sekme button{padding:8px 14px;border:0;background:transparent;font-size:14px;color:#555;border-radius:6px 6px 0 0}
.sekme button.on{background:#333;color:#fff;font-weight:600}
.sekme button span{font-size:12px;opacity:.75}
.k{color:var(--k);font-size:12px}
#dahafazla{display:none;margin:12px auto;padding:10px 18px}
.fpan{position:fixed;z-index:40;background:#fff;color:#222;border:1px solid #bbb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:10px;min-width:190px;max-height:320px;overflow:auto;font-size:13px}
.fpan label{display:block;padding:3px 0;cursor:pointer}
.fpan input[type=number]{width:90px;padding:5px;border:1px solid #ccc;border-radius:4px}
.fpan .alt{margin-top:8px;padding-top:8px;border-top:1px solid #eee;display:flex;gap:6px}
.fpan .alt button{flex:1;padding:5px;border:1px solid #ccc;background:#f7f7f5;border-radius:4px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#333;color:#fff;padding:10px 16px;display:none;align-items:center;gap:10px;z-index:30;flex-wrap:wrap}
#bar button{padding:7px 12px;border:0;border-radius:6px}
#bkars{background:var(--ok);color:#fff}#byaz{background:var(--acc);color:#fff}#btem{background:#666;color:#fff}
#bar button:disabled{opacity:.45;cursor:not-allowed}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;overflow:auto;padding:16px}
#kutu{background:#fff;max-width:880px;margin:10px auto;border-radius:10px;padding:16px;overflow-x:auto;position:relative}
#kapat{position:sticky;float:right;top:0;border:0;background:#eee;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.kart{display:flex;gap:16px;flex-wrap:wrap}
.kart .bilgi{flex:1;min-width:260px}
.kart img{width:220px;height:220px;object-fit:contain;background:#f3f3f1;border-radius:8px}
.kart h2{font-size:17px;margin:0 0 4px}
.oz{border-collapse:collapse;font-size:14px;margin-top:8px}
.oz td{padding:3px 14px 3px 0;vertical-align:top}.oz td:first-child{color:#777}
.tek{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tek th,.tek td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
.tek th{background:#f7f7f5}
.tek tr.ucuz td{background:#e8f5e9;font-weight:600}
.kars{border-collapse:collapse;font-size:13px;min-width:100%}
.kars th,.kars td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:top;min-width:140px;text-align:left}
.kars td:first-child,.kars th:first-child{color:#777;min-width:96px}
.kars th{background:#f7f7f5}.kars img{width:120px;height:120px;object-fit:contain}
.kazan{background:#e8f5e9;font-weight:600}
.aciklama{font-size:12px;color:var(--k);background:#fff;padding:8px 12px;border-radius:8px;margin:0 0 6px;line-height:1.6}
.aciklama summary{cursor:pointer;color:var(--acc)} .aciklama div{margin-top:6px}
/* Rehber: markalar, ozellik anlamlari, teknoloji siralamalari (kategoriler/<ad>_rehber.json) */
#rehber{display:none;border-color:var(--acc);color:var(--acc);font-weight:600}
.rhi{display:inline-block;margin-left:3px;font-size:11px;opacity:.75;cursor:help}
.t th .rhi{color:#9ecbff}
/* kompakt tek sayfa: kucuk yazi, ince marka satirlari, acilir ozellikler */
.rh{font-size:12px;line-height:1.4;color:#333}
.rh h2{margin:0 0 3px;font-size:15px}
.rh h3{margin:10px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888;font-weight:600;border-bottom:1px solid #e5e5e2;padding-bottom:2px}
.rh .oz1{margin:0;color:#555}
.rh .mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:18px}
.rh .m{padding:3px 0;border-bottom:1px solid #f2f2f0}
.rh .m .ust{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rh .m .g,.rh .m .c,.rh .k2{color:#999;font-size:11px}
.rh .m .c{margin-left:auto;white-space:nowrap}
.rh .m .not{color:#666;font-size:11.5px}
.rh .p{display:inline-block;min-width:26px;text-align:center;border-radius:8px;padding:0 4px;font-weight:700;font-size:11px}
.rh .cs{font-size:10px;color:#8a5a00;background:#fff3cd;border-radius:6px;padding:0 5px}
.rh .gs{border:0;background:none;padding:0;color:var(--acc);font-size:11px;cursor:pointer}
.rh .dm{margin-top:5px;font-size:11px;line-height:1.8}.rh .dm button{border:1px solid #e3e3e0;background:#fafaf8;border-radius:10px;padding:0 6px;margin:0 2px 2px 0;font-size:11px;color:#444}
.rh details.o,.rh .o.o1{border-bottom:1px solid #f0f0ee}
.rh .o.o1{padding:4px 0 4px 16px}.rh .o.o1.vurgu{background:#fff8e1}
.rh details.o summary{padding:4px 0;cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline}
.rh details.o summary::-webkit-details-marker{display:none}
.rh details.o summary::before{content:"▸";color:#aaa;width:10px}.rh details.o[open] summary::before{content:"▾"}
.rh details.o.vurgu summary{background:#fff8e1}
.rh .mk.kay{overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.rh .mk .ara,.rh .mk .dm{grid-column:1/-1}
.rh .mk .ara{position:sticky;top:0;z-index:1;background:#fff;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:6px 0 2px;border-bottom:1px solid #e5e5e2}
.rh .ic{padding:0 0 6px 16px;font-size:11.5px;color:#555}
.rh .iyi{color:var(--ok);margin-top:2px}
.rh ol{margin:4px 0 0;padding:0;list-style:none}
.rh ol li{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.rh ol li .no{flex:none;width:15px;height:15px;border-radius:50%;background:#555;color:#fff;font-size:10px;text-align:center;line-height:15px}
.rh ol li .n{flex:none;margin-left:auto;color:#999;font-size:11px;white-space:nowrap}
.rh .alt{font-size:11px;color:#999;margin-top:3px}
.csr{display:inline-block;font-size:10px;font-weight:600;color:#9a1b1b;background:#ffe3e0;border-radius:6px;padding:0 5px;vertical-align:middle;white-space:nowrap}
.tsh{display:inline-block;font-size:10px;font-weight:600;color:#8a3b00;background:#ffe0cc;border-radius:6px;padding:0 5px;vertical-align:middle}
#yazdir{display:none}
#mobil-araclar,#kartlar{display:none}
/* Kart gorunumu (body.gk): telefonda varsayilan, her ekranda 'Kart / Tablo' dugmesiyle secilir */
body.gk table.t{display:none}
body.gk #kartlar{display:grid;gap:10px;padding-top:4px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
body.gk .tw{overflow:visible;background:transparent;box-shadow:none;max-height:none!important;overscroll-behavior:auto}
body.gk #mobil-araclar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;max-width:560px}
#mobil-araclar label{min-width:0;font-size:11px;color:var(--k)}
#mobil-araclar select{display:block;width:100%;min-height:40px;font:inherit;font-size:15px;color:var(--fg);background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px}
.mobil-kart{padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0}
.mobil-kart.sec{background:var(--sel);border-color:#d6ae38}
.mk-ust{display:flex;gap:10px;align-items:flex-start}
.mk-resim{width:60px;height:60px;object-fit:contain;flex:none;border-radius:6px;background:#fff}
.mk-ad{flex:1;min-width:0}
.mk-detay{display:block;border:0;background:none;padding:0;text-align:left;color:var(--fg);font-size:15px;line-height:1.4;overflow-wrap:anywhere;width:100%;min-height:44px}
.mk-detay strong{display:block;font-weight:650}
.mk-ozellik{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.mk-ozellik span{font-size:12px;background:#f2f3f2;border-radius:5px;padding:3px 6px;overflow-wrap:anywhere}
.mk-alt{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.mk-fiyat{font-size:21px;line-height:1.2}
.mk-site{font-size:12px;color:var(--k);margin-top:4px;overflow-wrap:anywhere}
.mk-puan{font-size:12px;color:var(--ok);white-space:nowrap;text-align:right}
.mk-islem{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.mk-sec{display:flex;gap:6px;align-items:center;min-height:44px;font-size:12px;cursor:pointer}
.mk-ac{color:var(--acc);border:0;background:none;min-height:44px;padding:8px 0 8px 12px;font-size:13px}
.bos{text-align:center;color:var(--k);padding:32px 16px}
button,input,select{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:760px){
  body{padding:10px;line-height:1.45}
  .nav{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 8px;gap:6px;scrollbar-width:thin}
  .nav a{flex:none;min-height:40px;display:flex;align-items:center}
  h1{font-size:20px;line-height:1.25}
  .sub{font-size:12px;margin:6px 0 10px}
  #ust{padding-top:8px}
  .tools{gap:6px}
  #ara{order:-1;flex-basis:100%;min-width:0;width:100%;font-size:16px;min-height:44px}
  .btn{min-height:44px;padding:8px 10px}
  #tyaz{display:none}
  #mobil-araclar select{min-height:44px;font-size:16px}
  .sekme button{min-height:44px;flex:1;padding:8px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
  .fpan{inset:auto 8px max(8px,env(safe-area-inset-bottom))!important;max-height:70vh;max-height:70dvh;min-width:0;padding:16px;font-size:16px;z-index:60}
  .fpan label{display:flex;align-items:center;gap:8px;min-height:44px}
  .fpan input[type=number]{font-size:16px;min-height:44px;width:120px}
  .fpan .alt{position:sticky;bottom:-16px;background:#fff;padding:10px 0}
  .fpan .alt button{min-height:44px}
  #bar{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  #bar button{min-height:44px}
  #byaz{display:none}
  #ov{padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  #kutu{margin:0;max-width:100%;padding:12px;border-radius:12px}
  #kapat{width:44px;height:44px;z-index:5;background:#eee}
  .kart .bilgi{min-width:0;flex-basis:100%}
  .kart img{width:100%;height:160px}
  .oz{width:100%;table-layout:fixed;font-size:13px}
  .oz td{overflow-wrap:anywhere;padding:5px 6px 5px 0}
  .oz td:first-child{width:42%}
  .teklif-kaydir{margin-top:8px}
  .tek{display:block;font-size:13px;margin-top:0;width:100%}
  .tek tbody{display:block}
  .tek tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
  .tek tr:first-child{display:none}
  .tek td{border:0;padding:4px;overflow-wrap:anywhere}
  .tek td::before{content:attr(data-label);display:block;font-weight:400;font-size:11px;color:var(--k)}
  .tek td:last-child{grid-column:1/-1}
  .tek a{display:block;min-height:44px;padding:10px;text-align:center;background:#eef5ff;border-radius:6px;text-decoration:none}
  .kars th:first-child,.kars td:first-child{position:sticky;left:0;background:#f7f7f5;z-index:1;min-width:100px;max-width:100px}
  .rh .mk{grid-template-columns:minmax(0,1fr)}
  .rh .gs,.rh .dm button{min-height:40px}
}
@media print{
  body>*{display:none!important}
  body{background:#fff;padding:0}
  #yazdir{display:block!important}
  #yazdir h1{font-size:18px;margin:0}
  #yazdir .pm{font-size:10px;color:#555;margin:2px 0 8px}
  .pt{width:100%;border-collapse:collapse;font-size:9px}
  .pt th,.pt td{border:1px solid #bbb;padding:2px 4px;text-align:left}
  .pt th{background:#eee}
  .pt tr{break-inside:avoid}
  .pk{display:flex;gap:10px;border:1px solid #ccc;border-radius:6px;padding:8px;margin-bottom:8px;break-inside:avoid}
  .pk img{width:110px;height:110px;object-fit:contain}
  .pk h2{font-size:12px;margin:0 0 4px}
  .pk table{font-size:10px;border-collapse:collapse}.pk td{padding:1px 8px 1px 0}
  .pk .u{font-size:8px;color:#444;word-break:break-all}
  @page{margin:10mm}
}
</style>
</head>

function aralikMinMax(k, veri){let a=Infinity,b=-Infinity;for(const r of veri){const v=r[k];if(v!=null&&v!==""){a=Math.min(a,v);b=Math.max(b,v)}}return[a,b]}

}

function uygun(r){

  }
  for (const [k,f] of Object.entries(durum.suz)){
    const v = r[k];
    if (f.liste && !f.liste.has(String(v))) return false;
    if (f.min!=null && !(v!=null && v>=f.min)) return false;
    if (f.max!=null && !(v!=null && v<=f.max)) return false;

function hesapla(){
  liste = G().veri.filter(uygun);
  const k = durum.sira, y = durum.yon, c = COLS().find(x=>x.k===k);
  liste.sort((a,b)=>{const x=a[k],z=b[k];
    if (x==null||x==="") return 1; if (z==null||z==="") return -1;
    const fark = (c&&c.t==="s") ? y*String(x).localeCompare(String(z),"tr") : y*(x-z);
    return fark || (k==="fp" ? y*((a.fp_ham??a.fp)-(b.fp_ham??b.fp)) || b.kal-a.kal || a.fiyat-b.fiyat
      : k==="puan" ? y*((a.yorum||0)-(b.yorum||0)) || b.kal-a.kal : 0)   // esit yildizda cok yorumlu ustte (alfabe degil)

    + COLS().map(c => `<td class="${c.m?'m ':''}${c.cls||''}"${renk(c,r[c.k])}>${c.fmt?c.fmt(r[c.k],r):esc(r[c.k]??"?")}</td>`).join("") + "</tr>").join("");
  const kalan = liste.length - g.length, b = document.getElementById("dahafazla");
  b.style.display = kalan>0 ? "block" : "none";
  b.textContent = `${Math.min(kalan,300)} satır daha göster (kalan ${kalan})`;
  const suzgec = Object.keys(durum.suz).length + (durum.ara?1:0);
  const ne = mod==="teklif" ? "teklif" : BIRIM;
  document.getElementById("sayac").textContent = `${liste.length.toLocaleString("tr-TR")} / ${G().veri.length.toLocaleString("tr-TR")} ${ne} gösteriliyor` + (suzgec?` · ${suzgec} süzgeç`:"");
  document.getElementById("temizle").style.display = suzgec ? "inline-block" : "none";
  secimBar();
  if (typeof boyutla === "function") boyutla();
}

// --- suzgec paneli
let pan = null;
function panelKapat(){ if (pan){ pan.remove(); pan=null; } }
function panelAc(k, el){
  panelKapat();
  const c = COLS().find(x=>x.k===k), f = durum.suz[k] || {};
  pan = document.createElement("div"); pan.className = "fpan";
  if (c.f === "liste"){
    const say = {}, s0 = durum.suz[k]; delete durum.suz[k];
    for (const r of G().veri) if (uygun(r)) { const v=String(r[k]); say[v]=(say[v]||0)+1; }
    if (s0) durum.suz[k] = s0;
    const degerler = Object.keys(say).sort((a,b)=>say[b]-say[a]);
    pan.innerHTML = degerler.map(v=>`<label><input type="checkbox" value="${esc(v)}" ${!f.liste||f.liste.has(v)?'checked':''}> ${esc(v==="null"?"?":v)} <span class=k>(${say[v]})</span></label>`).join("")
      + '<div class="alt"><button data-a="hepsi">Hepsi</button><button data-a="hic">Hiçbiri</button><button data-a="tamam">Uygula</button></div>';
  } else {
    const [a,b] = aralikMinMax(k, G().veri);
    pan.innerHTML = `<div>en az <input type="number" id="pmin" value="${f.min??''}" placeholder="${Math.floor(a)}"></div>`
      + `<div style="margin-top:6px">en çok <input type="number" id="pmax" value="${f.max??''}" placeholder="${Math.ceil(b)}"></div>`
      + '<div class="alt"><button data-a="sil">Kaldır</button><button data-a="tamam">Uygula</button></div>';
  }
  document.body.appendChild(pan);
  const r = el.getBoundingClientRect();
  pan.style.left = Math.max(8, Math.min(r.left, innerWidth - pan.offsetWidth - 8)) + "px";
  pan.style.top = (r.bottom + 4) + "px";
  pan.onclick = e => {
    e.stopPropagation();
    const a = e.target.dataset.a; if (!a) return;
    const kut = [...pan.querySelectorAll("input[type=checkbox]")];
    if (a==="hepsi") kut.forEach(x=>x.checked=true);
    if (a==="hic") kut.forEach(x=>x.checked=false);
    if (a==="sil") { delete durum.suz[k]; panelKapat(); ciz(); }
    if (a==="tamam"){
      if (c.f==="liste"){ const s = new Set(kut.filter(x=>x.checked).map(x=>x.value));
        if (s.size===kut.length) delete durum.suz[k]; else durum.suz[k] = {liste:s}; }
      else { const mn = pan.querySelector("#pmin").value, mx = pan.querySelector("#pmax").value;
        if (mn===""&&mx==="") delete durum.suz[k]; else durum.suz[k] = {min:mn===""?null:+mn, max:mx===""?null:+mx}; }
      durum.limit = 300; panelKapat(); ciz();
    }
  };
}
document.addEventListener("click", e => { if (pan && !pan.contains(e.target)) panelKapat(); });

document.getElementById("bas").onclick = e => {
  const ri = e.target.closest(".rhi"); if (ri){ e.stopPropagation(); rehberAc(ri.dataset.rh); return; }
  const fb = e.target.closest(".fb"); if (fb){ e.stopPropagation(); panelAc(fb.dataset.f, fb); return; }
  const th = e.target.closest("th[data-k]"); if (!th) return;
  const k = th.dataset.k, c = COLS().find(x=>x.k===k);
  if (!c.s) return;                      // yalniz Puan / Kalite / Fiyat siralanir
  if (durum.sira===k) durum.yon *= -1; else { durum.sira=k; durum.yon = c.t==="s"||k==="fiyat"||k==="ucuzdan" ? 1 : -1; }
  ciz();
};
document.getElementById("govde").onclick = e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const id = tr.dataset.id;
  if (e.target.classList.contains("chk")) { secimDegis(id, e.target.checked); tr.classList.toggle("sec", e.target.checked); return; }

};
let zam; document.getElementById("ara").oninput = e => { clearTimeout(zam); zam = setTimeout(()=>{ durum.ara = e.target.value.trim().toLocaleLowerCase("tr"); durum.limit=300; ciz(); }, 200); };
document.getElementById("sifirla").onclick = () => { durum.sira="fp"; durum.yon=-1; durum.suz=VARSAYILAN_SUZ(); ciz(); };
document.getElementById("temizle").onclick = () => { durum.suz={}; durum.ara=""; document.getElementById("ara").value=""; ciz(); };
document.getElementById("dahafazla").onclick = () => { durum.limit += 300; ciz(); };

// --- secim / karsilastirma
function secimDegis(id, on){ if (on) durum.sec.add(id); else durum.sec.delete(id); secimBar(); }
function secimBar(){
  const n = durum.sec.size, bar = document.getElementById("bar");
  bar.style.display = n ? "flex" : "none";
  document.getElementById("bsay").textContent = `${n} seçili`;
  document.getElementById("bkars").disabled = n<2 || n>6;
  document.getElementById("bkars").title = n>6 ? "En çok 6 satır karşılaştırılır" : "";
  document.body.style.paddingBottom = n ? (bar.offsetHeight+16)+"px" : "";
}
document.getElementById("btem").onclick = () => { durum.sec.clear(); ciz(); };
document.getElementById("bkars").onclick = () => karsilastir([...durum.sec].map(id=>byId.get(id)));
document.getElementById("byaz").onclick = () => yazdirKartlar([...durum.sec].map(id=>byId.get(id)));
document.getElementById("tyaz").onclick = yazdirTablo;

function ac(html){ panelKapat(); document.getElementById("kutu").innerHTML = '<button id="kapat" title="Kapat" aria-label="Kapat">×</button>' + html; document.getElementById("ov").style.display="block"; document.getElementById("ov").scrollTop=0; document.body.style.overflow="hidden"; }
function kapat(){ document.getElementById("ov").style.display="none"; document.body.style.overflow=""; }
document.getElementById("ov").onclick = e => {
  if (e.target.id==="ov" || e.target.id==="kapat") return kapat();
  const ri = e.target.closest(".rhi"); if (ri) return rehberAc(ri.dataset.rh);
  const mk = e.target.closest("[data-mk]"); if (mk) return markaGoster(mk.dataset.mk);
};
document.addEventListener("keydown", e => { if (e.key==="Escape") kapat(); });

function ozTablo(r){ return '<table class="oz">' + OZ.map(([k,l,f]) => `<tr><td>${l}${rhIsaret(k)}</td><td>${f?f(r[k],r):esc(r[k]??"?")}</td></tr>`).join("") + "</table>"; }
function teklifTablo(u, vurgu){
  return '<table class="tek"><tr><th>Site</th><th>Satıcı</th><th>Fiyat</th><th>Taksit</th><th></th></tr>'
    + u.teklif.map((t,j) => `<tr class="${j===0?'ucuz':''}"${t[3]===vurgu?' style="outline:2px solid #1565c0"':''}><td data-label="Site">${esc(t[0])}${t[5]?" "+TESHIR:""}</td><td data-label="Satıcı">${esc(t[1])}</td><td data-label="Fiyat">${tl(t[2])}${t[6]?`<br><small class="k">Kontrol: ${esc(t[6].replace('T',' '))}</small>`:''}</td><td data-label="Taksit">${taksitYaz(t[4]&&t[4].pesin, t[4]&&t[4].max)}</td><td><a href="${esc(t[3])}" target="_blank" rel="noopener">Ürüne git ↗</a></td></tr>`).join("") + "</table>";
}
function detay(id){
  const r = byId.get(id), u = urunOf(r), teklifte = id[0]==="t";
  ac(`<div class="kart"><div class="bilgi"><h2>${esc(u.marka)} ${esc(u.model)}</h2><div class="k">${esc(r.isim)}</div>`
    + `<div style="margin-top:8px;font-size:18px"><span class="fiyat">${tl(r.fiyat)}</span> <span class="k">`
    + (teklifte ? `${esc(r.site)} · ${esc(r.satici)}` + (r.ucuzdan>0?` · en ucuzdan ${tl(r.ucuzdan)} pahalı`:" · en ucuz teklif")
                : `en ucuz · ${esc(u.site)}` + (u.n>1?` · ${u.n} satıcı, fark ${tl(u.fark)}`:""))
    + `</span></div>` + (u.cs ? `<div style="margin-top:4px">🔥 <b>Çok satan:</b> ${esc(u.cs)}</div>` : "") + `${ozTablo(r)}</div>`
    + (u.img?`<img src="${esc(u.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:"") + `</div>`
    + `<h3 style="margin:16px 0 0">Bu ürünün tüm fiyatları (${u.teklif.length} teklif)</h3><div class="teklif-kaydir">${teklifTablo(u, teklifte?r.url:null)}</div>`
    + `<label style="display:block;margin-top:12px"><input type="checkbox" id="dsec" ${durum.sec.has(id)?'checked':''}> karşılaştırma için seç</label>`);
  document.getElementById("dsec").onchange = e => { secimDegis(id, e.target.checked); ciz(); };
}
function karsilastir(rs){
  // 1 = buyuk iyi, -1 = kucuk iyi (bulasik makinesinde dB); kategori META.iyi ile ekler
  const iyi = Object.assign({kal:1, fp:1, puan:1}, META.iyi || {inc:1, hz:1, parlaklik:1});
  const sat = OZ.map(([k,l,f]) => {
    let en = null;
    if (iyi[k]) { const v = rs.map(r=>r[k]).filter(v=>typeof v==="number"); if (v.length>1) en = iyi[k]>0 ? Math.max(...v) : Math.min(...v); }
    return `<tr><td>${l}</td>` + rs.map(r=>`<td class="${en!=null&&r[k]===en?'kazan':''}">${f?f(r[k],r):esc(r[k]??"?")}</td>`).join("") + "</tr>";
  });
  const fen = Math.min(...rs.map(r=>r.fiyat));
  ac('<h2 style="margin:0 0 10px">Karşılaştırma</h2><table class="kars"><tr><th></th>'
    + rs.map(r=>{const u=urunOf(r);return `<th>${u.img?`<img src="${esc(u.img)}" alt="" referrerpolicy="no-referrer"><br>`:""}${esc(r.marka)} ${esc(r.model)}</th>`}).join("") + "</tr>"
    + `<tr><td>Fiyat</td>` + rs.map(r=>`<td class="${r.fiyat===fen?'kazan':''}">${tl(r.fiyat)}<br><span class=k>${esc(r.site)}${r.satici&&r.satici!==r.site?" · "+esc(r.satici):""}</span></td>`).join("") + "</tr>"
    + `<tr><td>Satıcı sayısı</td>` + rs.map(r=>`<td>${r.n}</td>`).join("") + "</tr>"
    + sat.join("") + "</table>");
}

// --- yazdirma (PDF)
function pbas(baslik){ return `<h1>${esc(baslik)}</h1><div class="pm">${esc(META.baslik)} · ${esc(G().ad)} · ${esc(META.tarih)} · ${esc(META.kaynak)}</div>`; }
function yazdirTablo(){
  hesapla();
  const cs = COLS().filter(c=>c.k!=="puan");
  document.getElementById("yazdir").innerHTML = pbas(`${liste.length} ${mod==="teklif"?"teklif":BIRIM}` + (Object.keys(durum.suz).length||durum.ara?" (süzülmüş)":""))
    + '<table class="pt"><tr><th>#</th>' + cs.map(c=>`<th>${c.l}</th>`).join("") + "</tr>"
    + liste.map((r,j)=>`<tr><td>${j+1}</td>` + cs.map(c=>`<td>${c.fmt?c.fmt(r[c.k],r):esc(r[c.k]??"?")}</td>`).join("") + "</tr>").join("") + "</table>";

function yazdirKartlar(rs){
  document.getElementById("yazdir").innerHTML = pbas(`Seçilen ${rs.length} satır`) + rs.map(r => { const u = urunOf(r); return `<div class="pk">${u.img?`<img src="${esc(u.img)}" alt="" referrerpolicy="no-referrer">`:""}<div><h2>${esc(r.marka)} ${esc(r.model)} — ${tl(r.fiyat)} (${esc(r.site)})</h2>${ozTablo(r)}`
    + '<table>' + u.teklif.map(t=>`<tr><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${tl(t[2])}</td><td class="u">${esc(t[3])}</td></tr>`).join("") + "</table></div></div>"; }).join("");
  setTimeout(()=>window.print(), 300);       // gorseller yuklensin
}

// --- rehber: kisa alici rehberi; markalarin altinda bu raporun canli verisi (urun sayisi, en ucuz, en iyi F/P)
const RH = META.rehber;
const nrm = s => String(s??"").replace(/[ıİI]/g,"i").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const RHK = {};                                   // sutun/ozellik anahtari -> kisa aciklama (i isareti)
if (RH) for (const o of RH.ozellikler||[]) for (const k of [].concat(o.k||[])) RHK[k] = o.ne;
function rhIsaret(k){ return RHK[k] ? `<span class="rhi" data-rh="${esc(k)}" title="${esc(RHK[k].replace(/<[^>]+>/g,""))}">ⓘ</span>` : ""; }
const puanRenk = p => p==null ? "#eee" : `hsl(${Math.round(Math.max(0,Math.min(1,(p-3)/7))*120)},55%,85%)`;
function markaVeri(){
  const m = {};
  for (const r of D){ const k = nrm(r.marka); const x = m[k] ||= {ad:r.marka, n:0, ucuz:null, fp:null};
    x.n++; if (!x.ucuz || r.fiyat<x.ucuz.fiyat) x.ucuz = r; if (!x.fp || r.fp>x.fp.fp) x.fp = r; }
  return m;
}
function rehberAc(hedef){
  if (!RH) return;
  const MV = markaVeri(), MP = {};
  for (const [k,v] of Object.entries(RH.marka_puan||{})) MP[nrm(k)] = v;
  const puan = ad => MP[nrm(ad)] ?? null;
  const satir = b => { const k = nrm(b.ad); const v = MV[k], p = puan(b.ad);
    return `<div class="m"><div class="ust"><b>${esc(b.ad)}</b><span class="p" style="background:${puanRenk(p)}" title="Marka puanı (10 üzerinden)">${p==null?"–":p}</span>`
      + (cokSatan.has(b.ad)?`<span class="cs" title="Bu raporda en çok ürünü olan markalardan">çok satan</span>`:"")
      + (b.grup?`<span class="g">${esc(b.grup)}</span>`:"")
      + `<span class="c">${v ? `${v.n} ${esc(BIRIM)} · <button class="gs" data-mk="${k}" title="Tabloda yalnız bu marka">Göster</button>` : ""}</span></div>`
      + `<div class="not">${b.not}</div></div>`; };
  // Markalar: ekrana sigdigi kadar (en az 5, en cok 8; kalanlar alici icin onemsiz). Aday = raporda kayda deger urunu olan notlu markalar (esik: en az 2,
  // buyuk raporda urunlerin %1'i). Onem sirasi kalite liderleri (marka puani) ile pazar liderleri (urun sayisi)
  // donusumlu; gosterim marka puanina gore. En cok urunlu 3 aday "cok satan" etiketi alir.
  const sayi = b => MV[nrm(b.ad)]?.n || 0, esik = Math.max(2, Math.round(D.length*0.01));
  let aday = (RH.markalar||[]).filter(b=>sayi(b)>=esik);
  if (aday.length < 5) aday = (RH.markalar||[]).filter(sayi);
  const kalSira = aday.slice().sort((a,b)=>((puan(b.ad)??0)-(puan(a.ad)??0)) || (sayi(b)-sayi(a)));
  const pazSira = aday.slice().sort((a,b)=>sayi(b)-sayi(a));
  const onem = [];
  for (let i = 0; i < aday.length; i++) for (const b of [kalSira[i], pazSira[i]]) if (!onem.includes(b)) onem.push(b);
  const cokSatan = new Set(pazSira.slice(0,3).map(b=>b.ad));
  const markaHtml = n => onem.slice(0,n).sort((a,b)=>((puan(b.ad)??0)-(puan(a.ad)??0)) || (sayi(b)-sayi(a))).map(satir).join("");
  const oz = (RH.ozellikler||[]).map(o => { const ka = [].concat(o.k||[])[0];
    // basamak d: rapordaki deger(ler); kac urunun o basamakta oldugu canli sayilir
    const say = d => { if (d==null || !ka) return ""; const ds = new Set([].concat(d).map(String));
      return `<span class="n">${D.filter(r => ds.has(String(r[ka]))).length} ${esc(BIRIM)}</span>`; };
    const ic = (o.iyi?`<div class="iyi">✔ ${o.iyi}</div>`:"")
      + (o.sira?`<ol>${o.sira.map((s,j)=>`<li><span class="no">${s.kademe??j+1}</span><span><b>${esc(s.ad)}</b>${s.ne?` <span class="k2">${s.ne}</span>`:""}</span>${say(s.d)}</li>`).join("")}</ol>`:"");
    const bas = `<b>${esc(o.ad)}</b> <span class="k2">${o.ne}</span>`, id = ka?` id="rh-${esc(ka)}"`:"";
    // anlam her zaman gorunur; yalniz iyi deger / siralama olan acilir
    return ic ? `<details class="o"${id}><summary>${bas}</summary><div class="ic">${ic}</div></details>` : `<div class="o o1"${id}>${bas}</div>`; }).join("");
  ac(`<div class="rh"><h2>📖 ${esc(RH.baslik||"Rehber")}</h2><p class="oz1">${RH.ozet||""}</p>`
    + `<h3>Öne çıkan markalar<span id="rh-ip"></span></h3><div class="mk" id="rh-mk"></div>`
    + `<h3>Parametreler <span style="text-transform:none;letter-spacing:0;font-weight:400">· ▸ olanlar açılır</span></h3>${oz}</div>`);
  const ov = document.getElementById("ov"), mk = document.getElementById("rh-mk"), kutu = document.getElementById("kutu");
  let n = Math.min(5, onem.length); mk.innerHTML = markaHtml(n);
  while (n < Math.min(8, onem.length)) {                      // sigdigi kadar marka: tasarsa son ekleneni geri al
    mk.innerHTML = markaHtml(n + 1);
    if (kutu.offsetHeight + 40 > innerHeight) { mk.innerHTML = markaHtml(n); break; }
    n++;
  }
  // Diger markalar: ayni alanda (yukseklik = sigan markalar), yalniz bu kutu kayar; "Diger markalar" ara basligi
  // kutunun tepesine yapisir. Once notlu kalanlar (ince satir), sonra notsuz ama kayda deger urunlu markalar.
  const kalan = (RH.markalar||[]).filter(sayi).filter(b => !onem.slice(0,n).includes(b))
    .sort((a,b)=>((puan(b.ad)??0)-(puan(a.ad)??0)) || (sayi(b)-sayi(a)));
  const notluK = new Set((RH.markalar||[]).map(b=>nrm(b.ad)));
  const notsuz = Object.entries(MV).filter(([k])=>!notluK.has(k)).sort((a,b)=>b[1].n-a[1].n);
  const kayda = notsuz.filter(([,v])=>v.n>=esik), az = notsuz.length - kayda.length, top = kalan.length + kayda.length;
  if (top) {
    const yuk = mk.offsetHeight;
    mk.innerHTML = markaHtml(n) + `<div class="ara">Diğer markalar · ${top}</div>` + kalan.map(satir).join("")
      + (kayda.length ? `<div class="dm">${kayda.map(([k,v])=>`<button data-mk="${k}" title="Marka puanı: ${puan(v.ad)??"bilinmiyor (nötr)"} · tabloda göster">${esc(v.ad)} <span class="k2">${v.n} · ${puan(v.ad)??"?"}</span></button>`).join("")}`
         + (az ? `<span class="k2">+ ${az} küçük marka</span>` : "") + "</div>" : "");
    mk.classList.add("kay"); mk.style.maxHeight = yuk + "px";
    document.getElementById("rh-ip").innerHTML = ` <span class="k2" style="text-transform:none;letter-spacing:0;font-weight:400">· ${top} marka daha, kutuyu kaydırın ▾</span>`;
  }
  const el = hedef && document.getElementById("rh-"+hedef);
  if (el){ el.open = true; el.classList.add("vurgu"); el.scrollIntoView({block:"center"}); } else ov.scrollTop = 0;
}
function markaGoster(k){
  const s = new Set(G().veri.filter(r=>nrm(r.marka)===k).map(r=>String(r.marka)));
  if (!s.size) return;
  durum.suz.marka = {liste:s}; durum.limit = 300; kapat(); ciz();
}
if (RH){ const b = document.getElementById("rehber"); b.style.display = "inline-block"; b.onclick = () => rehberAc(); }

document.getElementById("ozet").innerHTML = META.ozet;
document.getElementById("aciklama").innerHTML = META.aciklama;
// Tablo alani: ekranin sabit ust seridin altinda kalan kismi
function boyutla(){ if (kartGor()){ document.getElementById("tw").style.maxHeight=""; return; } const u = document.getElementById("ust").getBoundingClientRect().height;
  document.getElementById("tw").style.maxHeight = Math.max(240, innerHeight - u - 12) + "px"; }
addEventListener("resize", boyutla);
mobil.addEventListener("change", () => { panelKapat(); ciz(); boyutla(); });
document.getElementById("gorunum").onclick = () => { gorunumSecim = kartGor() ? "tablo" : "kart";
  try { localStorage.setItem("urun_gorunum", gorunumSecim); } catch(e) {} panelKapat(); ciz(); boyutla(); };
document.getElementById("mobil-sira").onchange = e => { const [k,y]=e.target.value.split(":"); durum.sira=k; durum.yon=+y; ciz(); };
document.getElementById("mobil-suz").onchange = e => { if(e.target.value) panelAc(e.target.value,e.target); e.target.value=""; };
document.getElementById("mobil-suz").onclick = e => e.stopPropagation();
document.getElementById("kartlar").onclick = e => {
  const kart=e.target.closest("article[data-id]"); if(!kart) return;
  if(e.target.classList.contains("chk")){ secimDegis(kart.dataset.id,e.target.checked); kart.classList.toggle("sec",e.target.checked); return; }
  const b=e.target.closest("[data-detay]"); if(b) detay(b.dataset.detay);
};
sekmeler(); ciz(); boyutla();
